version: "3.8"

services:
  video-agent:
    build:
      # Context is src/ so the image can lay the package out as /app/video_agent;
      # the Dockerfile path is relative to the context, not to this file.
      context: ..
      dockerfile: video_agent/Dockerfile
    environment:
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3