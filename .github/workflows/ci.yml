name: Video-Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest suite
        run: |
          pytest -v --tb=short

      - name: Run End-to-End Pipeline Demo
        run: |
          python scripts/run_demo.py

  remotion-check:
    name: Remotion Bundle & TypeScript Check (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: Verify Remotion Bundle
        working-directory: remotion
        run: npx remotion bundle src/index.ts
