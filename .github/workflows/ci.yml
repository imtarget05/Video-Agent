name: Video-Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest suite
        env:
          MOCK_VIDEO: "true"
          MOCK_TTS: "true"
          LLM_PROVIDER: mock
        run: |
          pytest -v --tb=short

      # Plan 2026-09-18 safety gates: auth, provider truthfulness, render job
      # persistence, webhook SSRF. These fail the build if any guard regresses.
      - name: Safety gates (auth / provider truth / render queue / webhook SSRF)
        env:
          MOCK_VIDEO: "true"
          MOCK_TTS: "true"
          LLM_PROVIDER: mock
        run: |
          pytest -q backend/tests/test_api_auth.py \
                     backend/tests/test_slice_a_backend.py \
                     backend/tests/contract/test_provider_schema.py \
                     backend/tests/test_render_jobs.py \
                     backend/tests/test_webhook_security.py \
                     backend/tests/test_slice_c_delivery.py

      - name: Run End-to-End Pipeline Demo
        env:
          MOCK_VIDEO: "true"
          MOCK_TTS: "true"
        run: |
          python scripts/run_demo.py

      - name: Assert render manifest
        run: |
          test -f remotion/render_manifest.json
          python -c "import json; m=json.load(open('remotion/render_manifest.json')); assert 'scenes' in m or 'totalDurationSec' in m, 'invalid manifest'; print('manifest OK:', len(m.get('scenes', [])))"

  remotion-check:
    name: Remotion Bundle & Render (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: Verify Remotion Bundle
        working-directory: remotion
        run: npx remotion bundle src/index.ts

      # The default compositions ship with no vendored media, so a render needs
      # the synthetic placeholder audio first. These are NOT licensed media; see
      # remotion/scripts/generate_placeholder_audio.mjs.
      - name: Generate placeholder audio
        working-directory: remotion
        run: npm run placeholder-audio

      # `remotion bundle` alone cannot catch a broken render: the composition
      # referenced four audio assets that were never committed, so the video had
      # never actually rendered and CI stayed green. This step is the regression
      # gate -- it fails the build on any non-zero render exit code.
      - name: Render Shorts916 to MP4
        working-directory: remotion
        run: npm run build

      - name: Assert rendered MP4 exists and is non-trivial
        working-directory: remotion
        run: |
          test -f out/shorts.mp4
          size=$(stat -c%s out/shorts.mp4)
          echo "rendered out/shorts.mp4 = ${size} bytes"
          if [ "$size" -lt 100000 ]; then
            echo "::error::rendered MP4 is only ${size} bytes - render did not produce real output"
            exit 1
          fi
